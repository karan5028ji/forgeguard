name: ForgeGuard Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday scan

permissions:
  contents: read
  security-events: write

jobs:
  forgeguard-audit:
    name: Autonomous SAST & STRIDE Threat Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ForgeGuard SAST & SARIF Export
        run: |
          python -m forgeguard.cli audit . --json report.json --sarif results.sarif --fail-on high

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: forgeguard-sast
